{% extends 'base.html' %}
{% load static %}
{% block content %}
<main class="main">
    <!-- 404 Error Page -->
    <section class="error-404 section">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="error-404-content text-center">
              <div class="error-404-animation" data-aos="zoom-in" data-aos-duration="1000">
                <div class="error-code">
                  <span>5</span>
                  <div class="error-icon">
                    <i class="bi bi-exclamation-triangle"></i>
                  </div>
                  <span>0</span>
                </div>
              </div>
              
              <h2 data-aos="fade-up" data-aos-delay="200">صفحه مورد نظر پیدا نشد</h2>
              <p class="error-description" data-aos="fade-up" data-aos-delay="300">
                ارور 500
              </p>
              
              <div class="error-actions" data-aos="fade-up" data-aos-delay="400">
                
                <div class="error-buttons">
                  <a href="/" class="btn-home">
                    <i class="bi bi-house-door"></i>
                    بازگشت به صفحه اصلی
                  </a>
                </div>
              </div>
              
              <div class="helpful-links" data-aos="fade-up" data-aos-delay="500">
                <h3>صفحات محبوب</h3>
                <div class="links-container">
                  <a href="{% url 'web:about' %}">درباره ما</a>
                  <a href="{% url 'web:services' %}">خدمات</a>
                  <a href="{% url 'web:contact' %}">تماس با ما</a>
                  <a href="{% url 'aiadviser:questions' %}">مشاوره هوش مصنوعی</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section><!-- End 404 Error Page -->
  </main>
  
  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
  
  <!-- Preloader -->
  <div id="preloader"></div>
  
  <!-- Vendor JS Files -->
  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/php-email-form/validate.js' %}"></script>
  <script src="{% static 'vendor/aos/aos.js' %}"></script>
  <script src="{% static 'vendor/glightbox/js/glightbox.min.js' %}"></script>
  <script src="{% static 'vendor/purecounter/purecounter_vanilla.js' %}"></script>
  <script src="{% static 'vendor/imagesloaded/imagesloaded.pkgd.min.js' %}"></script>
  <script src="{% static 'vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
  <script src="{% static 'vendor/swiper/swiper-bundle.min.js' %}"></script>
  
  <!-- Main JS File -->
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
{% endblock %}
